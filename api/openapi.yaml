openapi: 3.1.0
info:
  title: memini
  description: A Kubernetes-ready memory service for AI agents.
  version: 0.1.0
  license:
    name: AGPL-3.0-only
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Service is alive }
  /readyz:
    get:
      operationId: readyz
      tags: [ops]
      summary: Readiness probe (verifies storage backend)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /metrics:
    get:
      operationId: metrics
      tags: [ops]
      summary: Prometheus metrics
      description: Protected by bearer auth when MEMINI_API_KEY is set; unauthenticated otherwise.
      responses:
        "200": { description: Metrics in Prometheus text format }
        "401": { $ref: "#/components/responses/Error" }
  /v1/fsck:
    post:
      operationId: runFsck
      tags: [memory]
      summary: Run a consistency sweep (purge expired, enforce short-term cap, audit duplicates)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsckReport" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/dedup:
    post:
      operationId: runDedup
      tags: [memory]
      summary: Collapse near-duplicate memories (vector cluster) — tombstone the lower-scored members of each cluster
      description: |
        Clusters live memories by embedding similarity (cosine ≥
        `similarity`) and tombstones the lower-RetentionScore members of each
        cluster, pointing them at the cluster's representative. The action is
        reversible (SupersededBy → representative) and the duplicates remain in
        storage but are hidden from default search results. Dry-run reports the
        actions without committing them.

        Scoped to the request's namespace by default — the common case is
        cleaning up right after a large import into one namespace, where
        exports are typically full of restatements. Set `all_namespaces: true`
        to run the pass over every namespace instead.
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DedupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DedupReport" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/memories:
    post:
      operationId: rememberMemory
      tags: [memory]
      summary: Remember (store) a memory
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RememberRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMemories
      tags: [memory]
      summary: List memories in a namespace (backs the admin UI browser)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: tier
          in: query
          description: Repeatable and/or comma-separated tier filter; omitted means all tiers.
          schema: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        - name: tag
          in: query
          description: Repeatable and/or comma-separated tag filter; a memory must carry every listed tag (AND).
          schema: { type: array, items: { type: string } }
        - name: meta
          in: query
          description: >
            Repeatable metadata filter in "key=value" form; a memory's top-level
            metadata must contain every listed pair (AND). Only string values match.
          schema: { type: array, items: { type: string } }
        - name: include_expired
          in: query
          schema: { type: boolean, default: false }
        - name: include_superseded
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: Caps the result count; 0 or absent returns all matches.
          schema: { type: integer }
        - name: all_namespaces
          in: query
          description: >
            Aggregate across every namespace, ignoring the namespace header. The
            server merges all namespaces and applies limit as a single global cap
            (newest first), so the admin UI's "All projects" view fetches one
            response instead of one request per namespace.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: forgetByTag
      tags: [memory]
      summary: Delete every memory in the namespace carrying a tag
      description: >
        Bulk-deletes all memories in the request's namespace that carry the
        given tag. Combined with the import provenance tag
        (import:<source>:<date>), this undoes a single bulk import in one call.
        The tag query parameter is required to avoid an accidental
        delete-everything.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: tag
          in: query
          required: true
          description: Exact tag a memory must carry to be deleted.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteByTagResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/stats:
    get:
      operationId: getStats
      tags: [memory]
      summary: Per-namespace overview (counts by tier, accesses, importance)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: all_namespaces
          in: query
          description: >
            Aggregate counts across every namespace, ignoring the namespace
            header. Returns a single merged overview (namespace reported as "")
            so the admin UI's "All projects" view fetches one response instead
            of one request per namespace.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces:
    get:
      operationId: listNamespaces
      tags: [memory]
      summary: List the distinct namespaces holding memories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespacesResponse" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces/{name}/briefing:
    get:
      operationId: getBriefing
      tags: [memory]
      summary: Layered session-start briefing for a namespace
      description: >
        A query-less summary for injecting context when a session opens: the
        most durable facts and procedures, recent episodic activity, and pinned
        memories. Backs the plugin's SessionStart hook.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: per_section
          in: query
          description: Default cap applied to every section when its dedicated cap is unset. Default 5.
          schema: { type: integer }
        - name: per_section_pinned
          in: query
          description: Max pinned memories. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_facts
          in: query
          description: Max durable semantic facts. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_procedures
          in: query
          description: Max procedural how-to memories. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_recent
          in: query
          description: Max recent episodic entries. Overrides per_section. 0 disables the section.
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Briefing" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces/{name}:
    delete:
      operationId: deleteNamespace
      tags: [memory]
      summary: Delete every memory in a namespace
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteNamespaceResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMemory
      tags: [memory]
      summary: Fetch a memory by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: forgetMemory
      tags: [memory]
      summary: Forget (delete) a memory
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}/supersede:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: supersedeMemory
      tags: [memory]
      summary: Tombstone a memory, recording it was replaced by `by`.
      description: >
        Stamps `superseded_by` and `valid_to` on the target. The row stays in
        the store for audit/time-travel and is hard-deleted by the
        maintenance sweeper after `TombstoneTTL`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupersedeRequest" }
      responses:
        "204": { description: Superseded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/search:
    post:
      operationId: searchMemories
      tags: [memory]
      summary: Recall memories via hybrid (vector + keyword) search
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/answer:
    post:
      operationId: answerQuestion
      tags: [memory]
      summary: Recall memories and answer a question grounded on them (requires an LLM)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Namespace:
      name: X-Memini-Namespace
      in: header
      required: false
      description: Tenant/agent namespace; falls back to the server default.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Tier:
      type: string
      enum: [working, episodic, semantic, procedural]
    RememberRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        importance: { type: number, format: double, minimum: 0, maximum: 1 }
        ttl_seconds:
          type: integer
          description: Overrides the tier default TTL; negative means never expire.
        id:
          type: string
          description: Upserts an existing memory when provided.
        valid_from:
          type: string
          format: date-time
          description: >
            Start of the interval the fact was true. Defaults to now; backdate it
            to record a historical fact so time-travel (as_of) recall surfaces it.
        valid_to:
          type: string
          format: date-time
          description: >
            End of the interval the fact was true (for recording a fact that was
            true only in the past). Omit for a fact that is still true.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Seed corroboration for a durable fact (e.g. a trusted import). Omit
            to use the default seed; ignored for short-term tiers.
    SupersedeRequest:
      type: object
      required: [by]
      properties:
        by:
          type: string
          description: ID of the memory that replaces the target.
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        tiers: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        tags:
          type: array
          items: { type: string }
          description: A memory must carry every listed tag (AND).
        metadata:
          type: object
          additionalProperties: { type: string }
          description: A memory's top-level metadata must contain every listed key=value pair (AND).
        exclude_metadata:
          type: object
          additionalProperties: { type: string }
          description: >
            Drop memories whose top-level metadata carries any of these key=value
            pairs (the inverse of metadata). Lets a caller keep its own
            just-written memories out of recall — e.g. excluding the current
            session's captured turns so they are not echoed back as memory.
        limit: { type: integer, default: 10 }
        include_expired: { type: boolean, default: false }
        include_superseded: { type: boolean, default: false }
        scope:
          type: string
          enum: [exact, subtree]
          default: exact
          description: >
            exact (default) searches only the request namespace; subtree also
            searches namespaces nested under it ("project" reads "project/agent"),
            for the multi-agent read-shared-plus-private pattern.
        as_of:
          type: string
          format: date-time
          description: >
            Time-travel recall: return facts whose validity window contained this
            instant (including ones since superseded), for "what was true then"
            queries.
        min_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Per-call relevance floor on the fused score. Candidates below it are
            dropped server-side before re-ranking. 0 (or unset) falls back to
            the server's default gate (MEMINI_RECALL_MIN_SCORE). Only meaningful
            with score fusion (RRF scores are not comparable to this threshold).
    ScoredMemory:
      type: object
      required: [memory, score]
      properties:
        memory: { $ref: "#/components/schemas/Memory" }
        score: { type: number, format: double }
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScoredMemory" }
    AnswerRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        tiers: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        tags:
          type: array
          items: { type: string }
          description: Ground only on memories carrying every listed tag (AND).
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Ground only on memories whose top-level metadata contains every listed key=value pair (AND).
        limit:
          type: integer
          default: 10
          description: Caps how many recalled memories ground the answer.
    AnswerResponse:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ScoredMemory" }
    ListResponse:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
    Briefing:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string }
        facts:
          type: array
          description: Durable semantic facts, highest-retention first.
          items: { $ref: "#/components/schemas/Memory" }
        procedures:
          type: array
          description: Procedural how-to memories, highest-retention first.
          items: { $ref: "#/components/schemas/Memory" }
        recent:
          type: array
          description: Recent episodic activity, newest first.
          items: { $ref: "#/components/schemas/Memory" }
        pinned:
          type: array
          description: Pinned memories (any tier).
          items: { $ref: "#/components/schemas/Memory" }
    Stats:
      type: object
      required:
        [
          namespace,
          total,
          by_tier,
          expired,
          superseded,
          low_confidence_durable,
          total_accesses,
          avg_importance,
        ]
      properties:
        namespace: { type: string }
        total: { type: integer, description: Live memories (excludes expired/superseded) }
        by_tier:
          type: object
          additionalProperties: { type: integer }
        by_memory_type:
          type: object
          description: Live count per typed-extraction memory_type (decision/preference/problem).
          additionalProperties: { type: integer }
        expired: { type: integer }
        superseded: { type: integer }
        low_confidence_durable:
          type: integer
          description: Live durable memories whose decayed confidence is below the demote floor — reclaimable, uncorroborated debris.
        total_accesses: { type: integer }
        avg_importance: { type: number, format: double }
        last_write_at: { type: string, format: date-time, nullable: true }
    NamespacesResponse:
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items: { type: string }
    DeleteNamespaceResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: Number of memories deleted }
    DeleteByTagResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: Number of memories deleted }
    FsckReport:
      type: object
      required: [expired_purged, short_term_evicted, namespaces]
      properties:
        expired_purged: { type: integer }
        short_term_evicted: { type: integer }
        namespaces: { type: integer }
        duplicate_groups:
          type: array
          items: { type: array, items: { type: string } }
    DedupRequest:
      type: object
      description: |
        Optional knobs for one dedup pass. The zero value uses the production
        defaults (similarity 0.85, cluster size ≥ 2, all tiers, 20 neighbours
        per anchor, dry_run false), scoped to the request's namespace.
      properties:
        similarity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Cosine-like threshold for cluster membership. Higher = stricter
            (fewer, tighter clusters). 0 falls back to 0.85.
        min_cluster_size:
          type: integer
          minimum: 2
          description: Smallest cluster acted on. 0 falls back to 2.
        tiers:
          type: array
          items: { $ref: "#/components/schemas/Tier" }
          description: Restrict the pass to these tiers; empty means all.
        neighbours_per_anchor:
          type: integer
          minimum: 1
          description: Per-anchor vector-search fan-out. 0 falls back to 20.
        all_namespaces:
          type: boolean
          description: |
            Run the pass over every namespace instead of just the request's
            namespace. Defaults to false (scope to the request namespace).
        dry_run:
          type: boolean
          description: Report what would happen without tombstoning anything.
    DedupReport:
      type: object
      required: [namespaces, memories_seen, clusters_found, tombstoned, dry_run]
      properties:
        namespaces: { type: integer }
        memories_seen: { type: integer }
        clusters_found: { type: integer }
        tombstoned: { type: integer }
        dry_run: { type: boolean }
        actions:
          type: array
          description: Per-cluster representative selection. Omitted when no clusters were found.
          items: { $ref: "#/components/schemas/ClusterAction" }
    ClusterAction:
      type: object
      required: [representative_id, tombstoned_ids, size]
      properties:
        representative_id: { type: string }
        tombstoned_ids:
          type: array
          items: { type: string }
        size: { type: integer }
    Memory:
      type: object
      required:
        [
          id,
          namespace,
          tier,
          content,
          importance,
          created_at,
          updated_at,
          last_accessed_at,
          access_count,
        ]
      properties:
        id: { type: string }
        namespace: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        content: { type: string }
        summary: { type: string }
        metadata: { type: object, additionalProperties: true }
        tags: { type: array, items: { type: string } }
        importance: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_accessed_at: { type: string, format: date-time }
        access_count: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        superseded_by: { type: string, nullable: true }
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Start of the wall-clock interval the fact was true; null means open ("always, until valid_to"). Used by time-travel (as_of) recall.
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the interval the fact was true; null means open ("still true"). Stamped automatically when a fact is superseded.
        confidence:
          type: number
          format: double
          nullable: true
          description: Corroboration of a durable fact in [0,1]; null when not tracked.
