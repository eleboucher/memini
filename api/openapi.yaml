openapi: 3.1.0
info:
  title: memini
  description: A Kubernetes-ready memory service for AI agents.
  version: 0.1.0
  license:
    name: AGPL-3.0-only
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Service is alive }
  /readyz:
    get:
      operationId: readyz
      tags: [ops]
      summary: Readiness probe (verifies storage backend)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /metrics:
    get:
      operationId: metrics
      tags: [ops]
      summary: Prometheus metrics
      description: Protected by bearer auth when MEMINI_API_KEY is set; unauthenticated otherwise.
      responses:
        "200": { description: Metrics in Prometheus text format }
        "401": { $ref: "#/components/responses/Error" }
  /v1/fsck:
    post:
      operationId: runFsck
      tags: [memory]
      summary: Run a consistency sweep (purge expired, enforce short-term cap, audit duplicates)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsckReport" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/dedup:
    post:
      operationId: runDedup
      tags: [memory]
      summary: Collapse near-duplicate memories (vector cluster) — tombstone the lower-scored members of each cluster
      description: |
        Clusters live memories by embedding similarity (cosine ≥
        `similarity`) and tombstones the lower-RetentionScore members of each
        cluster, pointing them at the cluster's representative. The action is
        reversible (SupersededBy → representative) and the duplicates remain in
        storage but are hidden from default search results. Dry-run reports the
        actions without committing them.

        Scoped to the request's namespace by default — the common case is
        cleaning up right after a large import into one namespace, where
        exports are typically full of restatements. Set `all_namespaces: true`
        to run the pass over every namespace instead.
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DedupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DedupReport" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/memories:
    post:
      operationId: rememberMemory
      tags: [memory]
      summary: Remember (store) a memory
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RememberRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMemories
      tags: [memory]
      summary: List memories in a namespace (backs the admin UI browser)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: tier
          in: query
          description: Repeatable and/or comma-separated tier filter; omitted means all tiers.
          schema: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        - name: level
          in: query
          description: Repeatable and/or comma-separated level filter; omitted means all levels.
          schema: { type: array, items: { $ref: "#/components/schemas/Level" } }
        - name: tag
          in: query
          description: Repeatable and/or comma-separated tag filter; a memory must carry every listed tag (AND).
          schema: { type: array, items: { type: string } }
        - name: meta
          in: query
          description: >
            Repeatable metadata filter in "key=value" form; a memory's top-level
            metadata must contain every listed pair (AND). Only string values match.
          schema: { type: array, items: { type: string } }
        - name: include_expired
          in: query
          schema: { type: boolean, default: false }
        - name: include_superseded
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          description: Caps the result count; 0 or absent returns all matches.
          schema: { type: integer }
        - name: all_namespaces
          in: query
          description: >
            Aggregate across every namespace, ignoring the namespace header. The
            server merges all namespaces and applies limit as a single global cap
            under the requested sort, so the admin UI's "All projects" view fetches
            one response instead of one request per namespace.
          schema: { type: boolean, default: false }
        - name: namespace
          in: query
          description: >
            With all_namespaces=true, restrict the aggregate to these namespaces
            (repeatable, exact match); ignored otherwise. Lets the browser narrow
            an "All projects" listing without changing the active namespace.
          schema: { type: array, items: { type: string } }
        - name: memory_type
          in: query
          description: >
            Repeatable and/or comma-separated metadata.memory_type filter; a memory
            matches if its type is ANY of the listed values (OR). Distinct from
            "meta", which ANDs one value per key.
          schema: { type: array, items: { type: string } }
        - name: created_after
          in: query
          description: Only memories created at or after this instant.
          schema: { type: string, format: date-time }
        - name: accessed_after
          in: query
          description: Only memories last accessed at or after this instant.
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          description: Column to order by. Defaults to created_at.
          schema:
            type: string
            enum: [created_at, updated_at, last_accessed_at, access_count, importance]
            default: created_at
        - name: order
          in: query
          description: Sort direction. Defaults to desc (newest / highest first).
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: forgetByTag
      tags: [memory]
      summary: Delete every memory in the namespace carrying a tag
      description: >
        Bulk-deletes all memories in the request's namespace that carry the
        given tag. Combined with the import provenance tag
        (import:<source>:<date>), this undoes a single bulk import in one call.
        The tag query parameter is required to avoid an accidental
        delete-everything.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: tag
          in: query
          required: true
          description: Exact tag a memory must carry to be deleted.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteByTagResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/stats:
    get:
      operationId: getStats
      tags: [memory]
      summary: Per-namespace overview (counts by tier, accesses, importance)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: all_namespaces
          in: query
          description: >
            Aggregate counts across every namespace, ignoring the namespace
            header. Returns a single merged overview (namespace reported as "")
            so the admin UI's "All projects" view fetches one response instead
            of one request per namespace.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces:
    get:
      operationId: listNamespaces
      tags: [memory]
      summary: List the distinct namespaces holding memories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespacesResponse" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNamespace
      tags: [memory]
      summary: Delete every memory in the request namespace
      description: >
        Deletes all memories in the namespace given by the X-Memini-Namespace
        header. The namespace comes from the header (not the URL path), so a
        hierarchical name like "work/memini" needs no path encoding and works
        through any proxy.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteNamespaceResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces/briefing:
    get:
      operationId: getBriefing
      tags: [memory]
      summary: Layered session-start briefing for the request namespace
      description: >
        A query-less summary for injecting context when a session opens: the
        most durable facts and procedures, recent episodic activity, and pinned
        memories. The namespace comes from the X-Memini-Namespace header. Backs
        the plugin's SessionStart hook.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: per_section
          in: query
          description: Default cap applied to every section when its dedicated cap is unset. Default 5.
          schema: { type: integer }
        - name: per_section_pinned
          in: query
          description: Max pinned memories. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_facts
          in: query
          description: Max durable semantic facts. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_procedures
          in: query
          description: Max procedural how-to memories. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: per_section_recent
          in: query
          description: Max recent episodic entries. Overrides per_section. 0 disables the section.
          schema: { type: integer }
        - name: scope
          in: query
          description: >
            "full" (default) briefs the namespace plus its ancestor/home/link
            cascade; "project" briefs only the namespace (no cascade);
            "everywhere" is "full" plus namespaces nested under it ("project"
            also reads "project/agent"). "exact" and "subtree" are deprecated
            aliases kept for back-compat: "exact" behaves as "project" (its
            original, pre-cascade meaning) and "subtree" behaves as
            "everywhere". Any other value is rejected with 400.
          schema:
            type: string
            enum: [project, full, everywhere, exact, subtree]
            default: full
        - name: namespaces
          in: query
          description: >-
            Repeatable. Brief exactly these namespaces instead of the default read
            set (the namespace, its subtree, and the global namespace). An entry ending in "/*" also includes
            namespaces nested under it. Writes are unaffected.
          schema: { type: array, maxItems: 16, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Briefing" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces/read-set:
    get:
      operationId: getReadSet
      tags: [memory]
      summary: Resolve the structural read-set for the request namespace
      description: >
        Introspection endpoint: which namespaces a recall/briefing on the
        request namespace would draw from by default, and why (origin) —
        independent of any one request's tier filter. Header-scoped like
        `/v1/namespaces/briefing` (no path param): the namespace comes from
        X-Memini-Namespace, and X-Memini-Home, when set, contributes the home
        leg.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadSetResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/links:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
    post:
      operationId: putLink
      tags: [memory]
      summary: Create or replace a namespace link (cross-namespace read edge)
      description: >
        Adds a durable-tier read link from the request namespace
        (X-Memini-Namespace header, the src) to another namespace (dst):
        recall/briefing scoped to src additionally reads dst's durable
        (semantic/procedural) memories, same as an ancestor namespace.
        Idempotent — POSTing again with the same dst replaces its tiers/note.
        dst is normalized and rejected with 400 when empty, invalid, or equal
        to src (no self-links).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dst]
              properties:
                dst:
                  type: string
                  description: Target namespace.
                tiers:
                  type: array
                  items: { $ref: "#/components/schemas/Tier" }
                  description: >
                    Restrict which tiers cross the link; empty/omitted means
                    the durable default (semantic, procedural) — non-durable
                    tiers never cross a link regardless.
                note:
                  type: string
                  description: Free-text annotation for operators.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceLink" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      operationId: listLinks
      tags: [memory]
      summary: List outgoing namespace links from the request namespace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceLinksResponse" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLink
      tags: [memory]
      summary: Delete a namespace link
      parameters:
        - name: dst
          in: query
          required: false
          description: Target namespace to unlink. Required, via query or JSON body.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dst: { type: string, description: Target namespace to unlink. }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/namespaces/move:
    post:
      operationId: moveNamespace
      tags: [memory]
      summary: Relocate every memory in the request namespace to another namespace
      description: >
        Moves all memories (including superseded and expired) from the request
        namespace (X-Memini-Namespace header) to the target namespace. The
        target is normalized (surrounding whitespace/slashes trimmed, duplicate
        separators collapsed) and rejected with 400 when it contains "*" or
        equals the source. Supports dry-run. Backed by the same Move operation
        as `memini namespace move`.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  description: Target namespace.
                dry_run:
                  type: boolean
                  default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenamespaceReport" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/namespaces/split:
    post:
      operationId: splitNamespace
      tags: [memory]
      summary: Split the request namespace by metadata keys
      description: >
        Regroups the request namespace (X-Memini-Namespace header) by metadata,
        moving each record to the namespace named by the first of the given keys
        it carries. Supports dry-run. Backed by the same Split operation as
        `memini namespace split`.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                by:
                  type: array
                  items: { type: string }
                  description: Metadata keys to group by. Defaults to import_source_namespace, user_id, agent_id, run_id, project.
                dry_run:
                  type: boolean
                  default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenamespaceReport" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}/reassign:
    post:
      operationId: reassignMemory
      tags: [memory]
      summary: Move a single memory to a different namespace
      description: >
        Relocates one memory to the target namespace. The memory must exist in
        the request namespace (via the X-Memini-Namespace header); otherwise
        404. The target is normalized (surrounding whitespace/slashes trimmed,
        duplicate separators collapsed) and rejected with 400 when it contains
        "*" or equals the request namespace. Backed by Store.Reassign.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  description: Target namespace.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved:
                    type: integer
                    description: Always 1 (a missing memory is a 404, not moved=0).
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMemory
      tags: [memory]
      summary: Fetch a memory by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: forgetMemory
      tags: [memory]
      summary: Forget (delete) a memory
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}/history:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMemoryHistory
      tags: [memory]
      summary: The full version chain (supersession lineage) of a memory
      description: >
        Returns every version linked to this memory by supersession, oldest
        first: the memories it superseded and the ones that superseded it,
        including tombstoned rows. Useful for auditing how a fact evolved.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListResponse" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/memories/{id}/supersede:
    parameters:
      - { $ref: "#/components/parameters/Namespace" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: supersedeMemory
      tags: [memory]
      summary: Tombstone a memory, recording it was replaced by `by`.
      description: >
        Stamps `superseded_by` and `valid_to` on the target. The row stays in
        the store for audit/time-travel and is hard-deleted by the
        maintenance sweeper after `TombstoneTTL`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupersedeRequest" }
      responses:
        "204": { description: Superseded }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/search:
    post:
      operationId: searchMemories
      tags: [memory]
      summary: Recall memories via hybrid (vector + keyword) search
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/answer:
    post:
      operationId: answerQuestion
      tags: [memory]
      summary: Recall memories and answer a question grounded on them (requires an LLM)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/keys:
    get:
      operationId: listApiKeys
      tags: [memory]
      summary: List API keys (name/home/default namespace/created/disabled/source — never a secret or hash)
      description: >
        Admin-gated (K3b): allowed only when the request authenticated with
        the admin env key, or when auth is disabled entirely (dev/bootstrap
        mode — no admin key, an empty api_keys table, and no
        MEMINI_API_KEYS_FILE keys). A request authenticated by a named table
        or file key gets 403. Includes keys from both the api_keys table
        (source=db, mutable via this API) and the declarative
        MEMINI_API_KEYS_FILE (source=file, read-only here — see
        updateApiKey/deleteApiKey/rotateApiKey).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeysResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      tags: [memory]
      summary: Create a new API key, returning its secret exactly once
      description: >
        Admin-gated, see listApiKeys. This is the UI-first bootstrap path:
        with no admin key configured and no keys yet (auth disabled), create
        the first key here and auth is enforced immediately afterward — no
        TTL lag (see apiauth.Config.Invalidate). 409 if the name is already
        taken, whether by a table key or a MEMINI_API_KEYS_FILE entry.
        home/default_namespace are normalized and validated exactly like
        `memini key add`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyWithSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/keys/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateApiKey
      tags: [memory]
      summary: Update an API key's home namespace, default namespace, and/or disabled state
      description: >
        Admin-gated, see listApiKeys. Preserve-unspecified semantics matching
        `memini key add`'s rotation contract: an omitted field leaves the
        stored value unchanged; an explicitly passed field — including an
        explicit empty home/default_namespace, or disabled=false — overrides
        it. 404 if no such key exists; 409 for a MEMINI_API_KEYS_FILE-sourced
        key (managed declaratively via that file, not this API).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApiKeyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteApiKey
      tags: [memory]
      summary: Delete an API key
      description: >
        Admin-gated, see listApiKeys. 404 if no such key exists; 409 for a
        MEMINI_API_KEYS_FILE-sourced key (remove it from the file instead).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/keys/{name}/rotate:
    post:
      operationId: rotateApiKey
      tags: [memory]
      summary: Rotate an API key's secret, returning the new secret exactly once
      description: >
        Admin-gated, see listApiKeys. Generates a fresh secret (the one
        canonical generator, apiauth.GenerateSecret); the old secret stops
        authenticating immediately. Preserves the key's created_at,
        home/default namespace bindings, and disabled state unchanged. 404 if
        no such key exists; 409 for a MEMINI_API_KEYS_FILE-sourced key.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyWithSecret" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /v1/activity:
    get:
      operationId: listActivity
      tags: [memory]
      summary: Recent memory activity — what was served or written, and why
      description: >
        The activity log: reads (recall, get, session briefing) and writes
        (remember, update, forget, supersede), newest first. A recall event
        carries the query that ran and, for each memory it served, the rank and
        composite score it was served at — the "why" that per-memory access
        counters cannot reconstruct. Events are grouped by operation, so one
        recall serving five memories is one event with five memories.

        Returns 501 against a storage backend with no activity log.
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - name: kind
          in: query
          description: Repeatable and/or comma-separated event-kind filter; omitted means all kinds.
          schema: { type: array, items: { $ref: "#/components/schemas/EventKind" } }
        - name: tier
          in: query
          description: >
            Repeatable and/or comma-separated tier filter. Selects whole
            operations that touched a memory of a listed tier — a matching event
            is returned with every memory it served, so its counts stay truthful.
          schema: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        - name: q
          in: query
          description: >
            Free-text filter, case-insensitive. Selects whole operations whose
            recall query or any served memory's summary contains it.
          schema: { type: string }
        - name: since
          in: query
          description: Only events recorded at or after this instant.
          schema: { type: string, format: date-time }
        - name: namespace
          in: query
          description: >
            With all_namespaces=true, restrict the feed to these namespaces
            (repeatable, exact match); ignored otherwise.
          schema: { type: array, items: { type: string } }
        - name: limit
          in: query
          description: Caps the returned events (operations, not rows). Default 50, max 200.
          schema: { type: integer }
        - name: before
          in: query
          description: >
            Opaque cursor from a previous response's next_cursor; returns the page
            of events strictly older than it.
          schema: { type: string }
        - name: all_namespaces
          in: query
          description: Aggregate across every namespace, ignoring the namespace header.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Namespace:
      name: X-Memini-Namespace
      in: header
      required: false
      description: Tenant/agent namespace; falls back to the server default.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Tier:
      type: string
      enum: [working, episodic, semantic, procedural]
    Level:
      type: string
      enum: [explicit, deduced]
    RememberRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        tier:
          allOf:
            - $ref: "#/components/schemas/Tier"
          description: >-
            Omit to let the server choose: the content is classified by the
            marker heuristic (a terse, unhedged decision/preference/problem
            lands in semantic/procedural, stamped metadata.tier_classified=marker),
            falling back to working. Classification never picks working
            (the default) — it only raises to semantic/procedural.
        summary: { type: string }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        importance: { type: number, format: double, minimum: 0, maximum: 1 }
        level:
          allOf:
            - $ref: "#/components/schemas/Level"
          description: >-
            Label the derivation provenance (explicit vs deduced) at write time.
            Omit to leave unset (default, legacy rows, auto-tagged by service).
        ttl_seconds:
          type: integer
          description: Overrides the tier default TTL; negative means never expire.
        id:
          type: string
          description: Upserts an existing memory when provided.
        valid_from:
          type: string
          format: date-time
          description: >
            Start of the interval the fact was true. Defaults to now; backdate it
            to record a historical fact so time-travel (as_of) recall surfaces it.
        valid_to:
          type: string
          format: date-time
          description: >
            End of the interval the fact was true (for recording a fact that was
            true only in the past). Omit for a fact that is still true.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Seed corroboration for a durable fact (e.g. a trusted import). Omit
            to use the default seed; ignored for short-term tiers.
        visibility:
          type: string
          description: >
            Write-side namespace scoping. Omit or "project" (default) writes to
            the request namespace itself. "personal" writes to the caller's
            home namespace (X-Memini-Home header / MEMINI_HOME on the client)
            instead — an error if no home namespace is configured. Any other
            value must name an ancestor of the request namespace, either its
            full path or an unambiguous last path segment (e.g. "acme" for
            request namespace "acme/phoenix/api"), and the write lands there
            instead. Ignored for non-durable writes: an episodic/working memory
            always stays in the request namespace regardless of visibility.
    SupersedeRequest:
      type: object
      required: [by]
      properties:
        by:
          type: string
          description: ID of the memory that replaces the target.
    MergeHint:
      type: object
      description: >
        Optional. Returned on POST /v1/memories when the write's nearest
        same-tier candidate scored at/above MEMINI_WRITE_DEDUP_SCORE and
        MEMINI_WRITE_DEDUP_ACTION is "hint". The caller can decide whether to
        merge into the near-duplicate via memory_update.
      properties:
        similar_id:
          type: string
          description: ID of the near-duplicate memory.
        similar_content:
          type: string
          description: Preview (≤200 chars) of the near-duplicate memory's content.
        score:
          type: number
          format: double
          description: Fused similarity between the new write and the near-duplicate (0..1).
        tier:
          $ref: "#/components/schemas/Tier"
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        tiers: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        levels: { type: array, items: { $ref: "#/components/schemas/Level" } }
        tags:
          type: array
          items: { type: string }
          description: A memory must carry every listed tag (AND).
        metadata:
          type: object
          additionalProperties: { type: string }
          description: A memory's top-level metadata must contain every listed key=value pair (AND).
        exclude_metadata:
          type: object
          additionalProperties: { type: string }
          description: >
            Drop memories whose top-level metadata carries any of these key=value
            pairs (the inverse of metadata). Lets a caller keep its own
            just-written memories out of recall — e.g. excluding the current
            session's captured turns so they are not echoed back as memory.
        include_fresh_turns:
          type: boolean
          default: false
          description: >
            When true, disable the server-side temporal echo guard for this
            call: just-captured episodic turn captures (metadata.format="turn"
            younger than the server's window, default 5m) are NOT dropped.
            Default (false) drops them — a just-captured turn is live context,
            not long-term memory, and echoing it back makes the agent parrot
            itself. Opt in only when you genuinely need fresh turns.
        query_rewrite:
          type: boolean
          default: false
          description: >
            When true and an LLM is configured, rewrite the query into 2-3
            diverse variants before recall and fuse results via RRF. Cheapest
            read-path LLM lever; opt-in per call.
        limit: { type: integer, default: 10 }
        include_expired: { type: boolean, default: false }
        include_superseded: { type: boolean, default: false }
        scope:
          type: string
          enum: [project, full, everywhere, exact, subtree]
          default: full
          description: >
            "full" (default) searches the request namespace plus its
            ancestor/home/link cascade; "project" searches only the request
            namespace (no cascade); "everywhere" is "full" plus the request
            namespace's subtree, for the multi-agent read-shared-plus-private
            pattern. "exact" and "subtree" are deprecated aliases kept for
            back-compat: "exact" behaves as "project" (its original,
            pre-cascade meaning — the request namespace only) and "subtree"
            behaves as "everywhere". Any other value is rejected with 400.
        namespaces:
          type: array
          maxItems: 16
          items: { type: string }
          description: >-
            Search exactly these namespaces instead of the default read set (the request
            namespace, its subtree, and the global namespace). An entry ending in "/*" also
            includes namespaces nested under it. Writes are unaffected.
        as_of:
          type: string
          format: date-time
          description: >
            Time-travel recall: return facts whose validity window contained this
            instant (including ones since superseded), for "what was true then"
            queries.
        min_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Per-call relevance floor on the fused score. Candidates below it are
            dropped server-side before re-ranking. 0 (or unset) falls back to
            the server's baked relevance floor (0.1). Only meaningful with score
            fusion (RRF scores are not comparable to this threshold).
    ScoredMemory:
      type: object
      required: [memory, score]
      properties:
        memory: { $ref: "#/components/schemas/Memory" }
        score: { type: number, format: double }
        from:
          type: string
          description: >
            Read-set provenance beyond memory.namespace: omitted for a hit
            from the request (primary) namespace — the common case, no
            annotation needed — the ancestor/home namespace name itself for
            those two origins ("acme", "personal/kit"), and a prefixed form
            for a stored link or an explicit per-call namespace
            ("link:shared/golang", "call:acme/other"). Only populated when the
            read drew from a resolved read-set (recall/answer); omitted
            otherwise.
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/ScoredMemory" }
        degraded:
          type: string
          description: >-
            Set to "keyword_only" when the query embed failed or timed out and
            this search fell back to keyword-only matching; omitted on a
            healthy (vector+keyword) search.
        note:
          type: string
          description: >-
            Human-readable explanation of `degraded`; omitted alongside it on
            a healthy search.
    AnswerRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        tiers: { type: array, items: { $ref: "#/components/schemas/Tier" } }
        levels: { type: array, items: { $ref: "#/components/schemas/Level" } }
        tags:
          type: array
          items: { type: string }
          description: Ground only on memories carrying every listed tag (AND).
        metadata:
          type: object
          additionalProperties: { type: string }
          description: Ground only on memories whose top-level metadata contains every listed key=value pair (AND).
        scope:
          type: string
          enum: [project, full, everywhere, exact, subtree]
          default: full
          description: >
            Selects the grounding read-set shape, same vocabulary as the recall
            `scope`: "full" (default) grounds on the request namespace plus its
            ancestor/home/link cascade; "project" grounds on the request
            namespace only (no cascade); "everywhere" is "full" plus the
            request namespace's subtree. "exact" and "subtree" are deprecated
            aliases ("exact" → "project", "subtree" → "everywhere"). Any other
            value is rejected with 400. Reaches parity with the MCP
            `memory_answer` tool's `scope` argument.
        limit:
          type: integer
          default: 10
          description: Caps how many recalled memories ground the answer.
    AnswerResponse:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ScoredMemory" }
    ListResponse:
      type: object
      required: [memories]
      properties:
        memories:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
    EventKind:
      type: string
      description: >
        The operation an activity event records. Reads: recall, get, briefing.
        Writes: remember, update, forget, supersede.
      enum: [recall, get, briefing, remember, update, forget, supersede]
    ActivityMemory:
      type: object
      description: >
        One memory as it appeared in an event — a snapshot taken at serve time,
        so a forgotten memory still renders — plus why it was there.
      required: [id, namespace, summary, tier]
      properties:
        id: { type: string }
        namespace:
          type: string
          description: The memory's own namespace, which for a cascading recall may differ from the event's.
        summary: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        rank:
          type: integer
          description: 1-based position the memory was served at; absent when not applicable.
        score:
          type: number
          format: double
          description: Composite relevance score it was served with; recall only.
        section:
          type: string
          description: Which briefing section it appeared under; briefing only.
    ActivityEvent:
      type: object
      description: One logical operation, with the memories it served or wrote.
      required: [op_id, kind, time, namespace]
      properties:
        op_id: { type: string }
        kind: { $ref: "#/components/schemas/EventKind" }
        time: { type: string, format: date-time }
        namespace:
          type: string
          description: The namespace the request was made against.
        query:
          type: string
          description: The recall query; absent for every other kind.
        detail:
          type: object
          additionalProperties: true
          description: Kind-specific context — a recall's degraded mode, a supersession's replacement id.
        memories:
          type: array
          description: Empty for a recall that matched nothing.
          items: { $ref: "#/components/schemas/ActivityMemory" }
    ActivityResponse:
      type: object
      required: [events, has_more]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ActivityEvent" }
        next_cursor:
          type: string
          description: Pass as "before" to fetch the next page; absent on the last page.
        has_more: { type: boolean }
    Briefing:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string }
        scope_header:
          type: string
          nullable: true
          description: >
            A human-readable one-line summary of which namespaces this
            briefing drew from (its resolved read-set scope), e.g.
            "Scope: acme/phoenix/api ← acme/phoenix(3) ← acme(4) ←
            personal(2), +1 link" — primary first, then each cascade leg
            that contributed durable memories (nearest ancestor first, home
            last, counts per leg), then a "+K link(s)" suffix for
            contributing links.
        facts:
          type: array
          description: Durable semantic facts, highest-retention first.
          items: { $ref: "#/components/schemas/BriefingItem" }
        procedures:
          type: array
          description: Procedural how-to memories, highest-retention first.
          items: { $ref: "#/components/schemas/BriefingItem" }
        recent:
          type: array
          description: Recent episodic activity, newest first.
          items: { $ref: "#/components/schemas/BriefingItem" }
        pinned:
          type: array
          description: Pinned memories (any tier).
          items: { $ref: "#/components/schemas/BriefingItem" }
        children:
          type: array
          nullable: true
          description: >
            Direct-child namespace rollups (one segment deeper than the
            briefed namespace), each aggregating its whole subtree: all-tier
            live total plus up to 3 pinned and 3 recent-durable highlight
            memories. Ordered by most-recent write, capped at 10 children;
            omitted at a leaf namespace.
          items: { $ref: "#/components/schemas/BriefingChild" }
    BriefingItem:
      type: object
      required: [memory]
      properties:
        memory: { $ref: "#/components/schemas/Memory" }
        from:
          type: string
          description: >
            Read-set provenance beyond memory.namespace — same semantics as
            ScoredMemory.from (see there). Omitted for a primary-namespace
            item.
    BriefingChild:
      type: object
      required: [namespace, total]
      properties:
        namespace: { type: string }
        total:
          type: integer
          description: Live memory count in this child namespace.
        pinned:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
    Stats:
      type: object
      required:
        [
          namespace,
          total,
          by_tier,
          expired,
          superseded,
          low_confidence_durable,
          total_accesses,
          avg_importance,
        ]
      properties:
        namespace: { type: string }
        total: { type: integer, description: Live memories (excludes expired/superseded) }
        by_tier:
          type: object
          additionalProperties: { type: integer }
        by_memory_type:
          type: object
          description: Live count per typed-extraction memory_type (decision/preference/problem).
          additionalProperties: { type: integer }
        expired: { type: integer }
        superseded: { type: integer }
        low_confidence_durable:
          type: integer
          description: Live durable memories whose decayed confidence is below the demote floor — reclaimable, uncorroborated debris.
        total_accesses: { type: integer }
        avg_importance: { type: number, format: double }
        last_write_at: { type: string, format: date-time, nullable: true }
    NamespacesResponse:
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items: { type: string }
    DeleteNamespaceResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: Number of memories deleted }
    DeleteByTagResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: Number of memories deleted }
    NamespaceLink:
      type: object
      required: [src, dst, created_at]
      properties:
        src: { type: string }
        dst: { type: string }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/Tier" }
          description: >
            Tier restriction on the link; empty/omitted means the durable
            default (semantic, procedural).
        note: { type: string }
        created_at: { type: string, format: date-time }
    NamespaceLinksResponse:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items: { $ref: "#/components/schemas/NamespaceLink" }
    ReadSetOrigin:
      type: string
      description: >
        Why a namespace is in the read-set: "primary" is the request
        namespace (and its subtree, when expanded), "ancestor" is a
        path-prefix cascade leg, "home" is the caller's personal namespace,
        "link" is a stored namespace link, and "call" is an explicit per-call
        namespace.
      enum: [primary, ancestor, home, link, call]
    ReadSetEntryItem:
      type: object
      required: [namespace, origin]
      properties:
        namespace: { type: string }
        origin: { $ref: "#/components/schemas/ReadSetOrigin" }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/Tier" }
          description: >
            Tier restriction applied to this namespace; omitted means the
            request's own tier filter, unrestricted beyond that.
    ReadSetResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/ReadSetEntryItem" }
    RenamespaceReport:
      type: object
      properties:
        moved:
          type: integer
          description: Number of memories moved.
        targets:
          type: object
          additionalProperties: { type: integer }
          description: Memories moved into each destination namespace.
        skipped:
          type: integer
          description: Memories left in place (no grouping key, or already in place).
        dry_run:
          type: boolean
          description: Whether this was a dry run.
    FsckReport:
      type: object
      required: [expired_purged, short_term_evicted, namespaces]
      properties:
        expired_purged: { type: integer }
        short_term_evicted: { type: integer }
        namespaces: { type: integer }
        duplicate_groups:
          type: array
          items: { type: array, items: { type: string } }
    DedupRequest:
      type: object
      description: |
        Optional knobs for one dedup pass. The zero value uses the production
        defaults (similarity 0.85, cluster size ≥ 2, all tiers, 20 neighbours
        per anchor, dry_run false), scoped to the request's namespace.
      properties:
        similarity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Cosine-like threshold for cluster membership. Higher = stricter
            (fewer, tighter clusters). 0 falls back to 0.85.
        min_cluster_size:
          type: integer
          minimum: 2
          description: Smallest cluster acted on. 0 falls back to 2.
        tiers:
          type: array
          items: { $ref: "#/components/schemas/Tier" }
          description: Restrict the pass to these tiers; empty means all.
        neighbours_per_anchor:
          type: integer
          minimum: 1
          description: Per-anchor vector-search fan-out. 0 falls back to 20.
        all_namespaces:
          type: boolean
          description: |
            Run the pass over every namespace instead of just the request's
            namespace. Defaults to false (scope to the request namespace).
        dry_run:
          type: boolean
          description: Report what would happen without tombstoning anything.
    DedupReport:
      type: object
      required: [namespaces, memories_seen, clusters_found, tombstoned, dry_run]
      properties:
        namespaces: { type: integer }
        memories_seen: { type: integer }
        clusters_found: { type: integer }
        tombstoned: { type: integer }
        dry_run: { type: boolean }
        actions:
          type: array
          description: Per-cluster representative selection. Omitted when no clusters were found.
          items: { $ref: "#/components/schemas/ClusterAction" }
    ClusterAction:
      type: object
      required: [representative_id, tombstoned_ids, size]
      properties:
        representative_id: { type: string }
        tombstoned_ids:
          type: array
          items: { type: string }
        size: { type: integer }
    Memory:
      type: object
      required:
        [
          id,
          namespace,
          tier,
          content,
          importance,
          created_at,
          updated_at,
          last_accessed_at,
          access_count,
        ]
      properties:
        id: { type: string }
        namespace: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
        level:
          allOf:
            - $ref: "#/components/schemas/Level"
          description: >-
            Derivation provenance: explicit (user-stated / heuristic) vs
            deduced (LLM-distilled). Null/omitted when the row predates the
            tag or when unset.
        content: { type: string }
        summary: { type: string }
        metadata: { type: object, additionalProperties: true }
        tags: { type: array, items: { type: string } }
        importance: { type: number, format: double }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_accessed_at: { type: string, format: date-time }
        access_count: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        superseded_by: { type: string, nullable: true }
        valid_from:
          type: string
          format: date-time
          nullable: true
          description: Start of the wall-clock interval the fact was true; null means open ("always, until valid_to"). Used by time-travel (as_of) recall.
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: End of the interval the fact was true; null means open ("still true"). Stamped automatically when a fact is superseded.
        confidence:
          type: number
          format: double
          nullable: true
          description: Corroboration of a durable fact in [0,1]; null when not tracked.
        merge_hint:
          $ref: "#/components/schemas/MergeHint"
          description: >
            Optional. Present only on POST /v1/memories responses when the
            write's nearest same-tier candidate scored at/above
            MEMINI_WRITE_DEDUP_SCORE and MEMINI_WRITE_DEDUP_ACTION is "hint".
        auto_superseded:
          type: boolean
          description: >
            Optional. Present only on POST /v1/memories responses when the
            write's nearest same-tier candidate scored at/above
            MEMINI_WRITE_DEDUP_SCORE with MEMINI_WRITE_DEDUP_ACTION="supersede"
            and the old memory was tombstoned in the background. The caller
            still receives the new memory.
        reinforced:
          type: boolean
          description: >
            Optional. Present only on POST /v1/memories responses when the fact
            was already known and NO new memory was created: the existing memory
            was strengthened (reinforced and corroborated) and is what this
            response returns. Two paths reach it — the exact-restatement
            fingerprint fast path, and MEMINI_WRITE_DEDUP_ACTION="coalesce" when
            the incoming phrasing is not richer than the stored one. Without this
            flag a 201 would read as "created", which is exactly what did not
            happen, and the id would appear to belong to a memory the caller
            wrote when it does not.
    ApiKeySource:
      type: string
      enum: [db, file]
      description: >
        Where the key is stored: "db" is a row in the api_keys table
        (mutable via this API); "file" comes from MEMINI_API_KEYS_FILE,
        loaded once at boot and immutable through this API — update/rotate/
        delete all reject a "file" key with 409.
    ApiKey:
      type: object
      required: [name, disabled, source]
      properties:
        name: { type: string }
        home:
          type: string
          description: Bound home namespace; omitted/empty means unbound.
        default_namespace:
          type: string
          description: >
            Namespace applied when a request presents this key with no
            explicit X-Memini-Namespace header.
        created_at:
          type: string
          format: date-time
          description: >
            Omitted for a source=file key: MEMINI_API_KEYS_FILE entries carry
            no creation timestamp (the file is the source of truth, not a
            database row) — always present for source=db.
        disabled: { type: boolean }
        source: { $ref: "#/components/schemas/ApiKeySource" }
    ApiKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/ApiKey" }
    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >
                The plaintext credential, shown exactly once, here — it is
                never stored (only its SHA-256 hash is) and cannot be
                recovered or displayed again.
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        home: { type: string, description: Bind the key to a home namespace. }
        default_namespace:
          type: string
          description: Namespace applied when a request presents this key with no explicit namespace header.
        disabled: { type: boolean, default: false, description: Create the key already disabled. }
    UpdateApiKeyRequest:
      type: object
      properties:
        home:
          type: string
          description: >
            Omit to leave the current binding unchanged; an explicit empty
            string clears it.
        default_namespace:
          type: string
          description: >
            Omit to leave the current default unchanged; an explicit empty
            string clears it.
        disabled:
          type: boolean
          description: Omit to leave the current disabled state unchanged.
