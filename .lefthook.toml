[pre-commit.commands.gofmt]
glob = "*.go"
run = "gofmt -w {staged_files}"
stage_fixed = true

[pre-commit.commands.golangci-lint]
glob = "*.go"
run = "golangci-lint run"

[pre-commit.commands.format]
# oxfmt formats markdown/json/yaml; honours .prettierignore.
glob = "*.{md,json,yaml,yml}"
# Generated lockfiles are ignored by oxfmt; excluding them stops the formatter
# from being handed only-ignored files and exiting non-zero. pnpm-lock.yaml
# covers both the workspace root and the standalone ui/ project.
exclude = ["**/package-lock.json", "**/pnpm-lock.yaml"]
run = "oxfmt --write --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.tidy]
glob = "go.{mod,sum}"
run = "go mod tidy"
stage_fixed = true

[pre-push.commands.test]
run = "go test ./..."

# Compile-check the bench eval harnesses (behind the `bench` tag, so excluded
# from `go test ./...` above). `-run=^$` matches no test, so it builds the files
# but runs none — catching compile errors without triggering the minutes-long,
# live-embedder eval run.
[pre-push.commands.bench-compile]
run = "go test -tags bench -run=^$ ./bench/"
