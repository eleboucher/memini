[pre-commit.commands.rustfmt]
glob = "*.rs"
run = "cargo fmt --all"
stage_fixed = true

[pre-commit.commands.clippy]
glob = "*.rs"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[pre-commit.commands.format]
# oxfmt formats markdown/json/yaml; honours .prettierignore.
glob = "*.{md,json,yaml,yml}"
# Generated lockfile is ignored by oxfmt; excluding it stops the formatter from
# being handed only-ignored files and exiting non-zero.
exclude = ["**/package-lock.json"]
run = "oxfmt --write --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.lockfile]
glob = "{Cargo.toml,crates/**/Cargo.toml}"
run = "cargo check --workspace --locked"
stage_fixed = true

[pre-push.commands.test]
run = "cargo test --workspace --locked"

# Compile-check the benchmark binaries and library without running a live eval.
[pre-push.commands.bench-compile]
run = "cargo test -p memini-bench --no-run --locked"
