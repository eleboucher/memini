[pre-commit.commands.gofmt]
glob = "*.go"
run = "gofmt -w {staged_files}"
stage_fixed = true

[pre-commit.commands.golangci-lint]
glob = "*.go"
run = "golangci-lint run"

[pre-commit.commands.format]
# oxfmt formats markdown/json/yaml; honours .prettierignore.
glob = "*.{md,json,yaml,yml}"
# Generated lockfile is ignored by oxfmt; excluding it stops the formatter from
# being handed only-ignored files and exiting non-zero.
exclude = ["**/package-lock.json"]
run = "oxfmt --write --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.tidy]
glob = "go.{mod,sum}"
run = "go mod tidy"
stage_fixed = true

[pre-push.commands.test]
run = "go test ./..."
