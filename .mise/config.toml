# mise is the single source of truth for tool versions and dev tasks.
# `mise install` provisions the toolchain; `mise run <task>` runs a task;
# `mise tasks` lists them. CI uses the same tasks so local == CI.
[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
lefthook = "2.1.11"
helm = "4.2.4"
helm-docs = "1.14.2"
"aqua:dadav/helm-schema" = "0.23.4"
kind = "0.32.0"
kubectl = "1.36.4"
stern = "1.34.0"
oxfmt = "0.63.0"
yq = "4.53.6"
jq = "1.8.2"
node = "24.19.0"

[settings]
# Required for the postinstall hook below (auto-installs git hooks via lefthook).
experimental = true

[env]
# Keep the sqlite dev database out of the way and ephemeral.
MEMINI_SQLITE_PATH = "{{ config_root }}/bin/memini.dev.db"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[tasks.test]
description = "Run unit tests with coverage"
depends = ["fmt", "vet"]
run = "go test ./... -coverprofile cover.out"

[tasks.test-hooks]
description = "Run Node hook script tests (plugin/scripts/_test.mjs)"
run = "node --test plugin/scripts/_test.mjs"

[tasks.test-integration]
description = "Run integration tests (testcontainers; requires Docker)"
run = "go test -tags=integration ./... -count=1"

[tasks.build]
description = "Build the memini binary into ./bin"
# `ui` builds dist/ (gitignored) so the binary embeds the real bundle.
depends = ["fmt", "vet", "ui"]
run = '''
version="${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
commit="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
pkg="github.com/eleboucher/memini/internal/version"
CGO_ENABLED=0 go build \
  -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.Date=${date}" \
  -o bin/memini ./cmd/memini
'''

[tasks.ui]
description = "Build the embedded admin UI (Preact + Vite) into internal/api/ui/dist"
dir = "ui"
# gen-api regenerates src/api-schema.gen.ts from api/openapi.yaml so the UI
# types can't drift from the spec. The generated file stays committed: the
# Docker build only copies ui/ and cannot regenerate it.
#
# --ignore-workspace is required: ui/ lives inside the pnpm-workspace root but
# is NOT a member, so a bare `pnpm install` here resolves the workspace's
# projects (packages/*, the plugins) and skips ui's own deps entirely. The flag
# makes pnpm treat ui as the standalone project it is, installing from ui's own
# pnpm-lock.yaml.
run = "pnpm install --ignore-workspace --frozen-lockfile && pnpm run gen-api && pnpm run build"

[tasks.ui-dev]
description = "Run the UI dev server with HMR (proxies /v1 to a local memini on :8080)"
dir = "ui"
# --ignore-workspace: see the `ui` task above.
run = "pnpm install --ignore-workspace && pnpm run dev"

[tasks.run]
description = "Run the service from source"
run = "go run ./cmd/memini"

[tasks.bench]
description = "Run the retrieval benchmark (offline sample by default)"
run = "go run ./cmd/bench"

[tasks.build-client]
description = "Regenerate plugin/scripts/_client.gen.mjs from packages/memini-client"
# The plugin ships as raw files (no install-time build), so the shared client
# core is bundled to a committed .mjs the hooks can import under a bare `node`.
run = '''
pnpm install --frozen-lockfile --filter @memini/client...
pnpm --filter @memini/client run bundle
'''

[tasks.client-check]
description = "Fail if the generated plugin client bundle is stale (CI gate)"
run = '''
mise run build-client
git diff --exit-code plugin/scripts/_client.gen.mjs
'''

[tasks.rest-check]
description = "Fail if the generated REST server code is stale (CI gate)"
run = '''
go generate ./internal/api/rest
git diff --exit-code internal/api/rest/api.gen.go
'''

[tasks.gen-api]
description = "Regenerate the UI's settings catalog and API schema from api/openapi.yaml"
dir = "ui"
# --ignore-workspace: see the `ui` task.
run = '''
pnpm install --ignore-workspace --frozen-lockfile
pnpm run gen-api
'''

[tasks.gen-api-check]
description = "Fail if the generated UI API files are stale (CI gate)"
dir = "ui"
run = '''
mise run gen-api
git diff --exit-code src/settings-catalog.gen.ts src/api-schema.gen.ts
'''

[tasks.test-client]
description = "Run the shared client core tests (packages/memini-client)"
run = "pnpm --filter @memini/client test"

[tasks.docs]
description = "Regenerate the docs reference from the code"
run = '''
go generate ./internal/config
go run -tags gendocs ./cmd/memini gen-docs --out docs/reference/cli.md
'''

[tasks.docs-check]
description = "Fail if the generated docs reference is stale (CI gate)"
run = '''
mise run docs
git diff --exit-code docs/reference/
'''

[tasks.helm-lint]
description = "Lint the Helm chart"
run = "helm lint charts/memini"

[tasks.helm-docs]
description = "Regenerate the chart README + values.schema.json"
run = '''
helm-docs --chart-search-root=charts --log-level=warn
helm-schema --chart-search-root charts/memini --skip-auto-generation required,additionalProperties --append-newline
'''

[tasks.helm-docs-check]
description = "Fail if the generated chart README/schema are stale (CI gate)"
run = '''
mise run helm-docs
git diff --exit-code charts/memini/README.md charts/memini/values.schema.json
'''

[hooks]
postinstall = "lefthook install"
