---
name: Build and push container image
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-image:
    runs-on: multiarch
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4
      - name: Compute build timestamp
        id: build-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Login to git.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.OWNER_PACKAGE_SECRET }}
      - name: Compute image metadata
        id: meta
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            git.erwanleboucher.dev/${{ vars.USERNAME }}/memini
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=memini
            org.opencontainers.image.description=memini — a memory service for AI agents (MCP + REST, hybrid retrieval, K8s-native)
            org.opencontainers.image.documentation=https://git.erwanleboucher.dev/eleboucher/memini/src/branch/main/README.md
            org.opencontainers.image.authors=Erwan Leboucher <erwanleboucher@gmail.com>
            org.opencontainers.image.vendor=Erwan Leboucher
      # One platform at a time: with both Go cross-compiles running in
      # parallel, the multiarch runner ran out of memory compiling the large
      # anthropic-sdk-go dependency («compile: signal: terminated»). Build
      # each platform, push by digest, then assemble the manifest list.
      - name: Build and push (amd64)
        id: build-amd64
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=git.erwanleboucher.dev/${{ vars.USERNAME }}/memini,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            DATE=${{ steps.build-meta.outputs.created }}
      - name: Build and push (arm64)
        id: build-arm64
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=git.erwanleboucher.dev/${{ vars.USERNAME }}/memini,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            DATE=${{ steps.build-meta.outputs.created }}
      - name: Create and push manifest list
        env:
          IMAGE: git.erwanleboucher.dev/${{ vars.USERNAME }}/memini
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          cmd=(docker buildx imagetools create)
          while IFS= read -r tag; do
            [ -n "$tag" ] && cmd+=(-t "$tag")
          done <<< "$TAGS"
          cmd+=("$IMAGE@${{ steps.build-amd64.outputs.digest }}" "$IMAGE@${{ steps.build-arm64.outputs.digest }}")
          "${cmd[@]}"
