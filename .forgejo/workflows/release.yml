---
name: Release
on:
  push:
    tags:
      - "v*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: docker
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        env:
          # renovate: datasource=github-releases depName=orhun/git-cliff
          GIT_CLIFF_VERSION: "2.12.0"
        run: |
          set -euo pipefail
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          wget -q "${BASE}/${ASSET}"
          wget -q "${BASE}/${ASSET}.sha512"
          sha512sum -c "${ASSET}.sha512"
          tar -xzf "${ASSET}" -C /tmp
          install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Generate release notes
        id: changelog
        run: |
          set -euo pipefail
          CONTENT="$(git-cliff --config cliff.toml --latest --strip all)"
          printf 'content<<EOF\n%s\nEOF\n' "$CONTENT" >> "$GITHUB_OUTPUT"
      - name: Create release
        id: create
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "GITEA_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          RESPONSE="$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
            | curl -sS -X POST \
                -w '\n%{http_code}' \
                -H "Authorization: token ${GITEA_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "https://git.erwanleboucher.dev/api/v1/repos/${GITHUB_REPOSITORY}/releases")"
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "release create failed: HTTP $HTTP_CODE" >&2
            echo "$BODY" >&2
            exit 1
          fi
          RELEASE_ID="$(echo "$BODY" | jq -r '.id')"
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "failed to parse release id from response: $BODY" >&2
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  clawhub:
    needs: [release]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Install Node.js
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install workspace dependencies
        run: pnpm install --config.minimumReleaseAge=0

      - name: Build namespace resolver
        run: pnpm --filter @memini/namespace-resolver build

      # Build the TypeScript plugin (src/index.ts -> dist/) so the
      # published clawpack contains the ./dist/index.js entry referenced
      # by openclaw.extensions. dist/ is gitignored.
      - name: Build OpenClaw plugin
        run: |
          set -euo pipefail
          cd integrations/openclaw/plugin
          pnpm install
          pnpm run build

      - name: Install ClawHub CLI
        env:
          # renovate: datasource=npm depName=clawhub
          CLAWHUB_VERSION: "0.21.0"
        run: npm install -g "clawhub@${CLAWHUB_VERSION}"

      # Publishes the OpenClaw memory-slot plugin as a local-folder code-plugin.
      # The version is taken from the release tag, so it always matches the tag
      # regardless of what bump.yml committed.
      - name: Publish OpenClaw plugin to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          SOURCE_REPO: eleboucher/memini
        run: |
          set -euo pipefail
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "CLAWHUB_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          CONFIG="$(mktemp)"
          trap 'rm -f "$CONFIG"' EXIT
          jq -n --arg registry "https://clawhub.ai" --arg token "$CLAWHUB_TOKEN" \
            '{registry: $registry, token: $token}' > "$CONFIG"
          export CLAWHUB_CONFIG_PATH="$CONFIG"
          clawhub package publish ./integrations/openclaw/plugin \
            --family code-plugin \
            --version "$VERSION" \
            --source-repo "$SOURCE_REPO" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --json
  # Mirror the Hermes plugin to a standalone repo whose root is the plugin, so
  # `hermes plugins install eleboucher/memini-hermes` and `hermes plugins
  # update` both work (a monorepo subdir install supports neither).
  hermes-mirror:
    needs: [release]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Mirror Hermes plugin to standalone GitHub repo
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR_REPO: eleboucher/memini-hermes
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_MIRROR_TOKEN:-}" ]; then
            echo "GH_MIRROR_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          WORKSPACE="$(pwd)"
          git config --global user.email "ci@erwanleboucher.dev"
          git config --global user.name "memini release bot"
          MIRROR="$(mktemp -d)"
          git clone "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" "$MIRROR"
          # Replace tracked files (keep .git) with the plugin dir + README.
          find "$MIRROR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$WORKSPACE/integrations/hermes/plugin/memini/." "$MIRROR/"
          cp "$WORKSPACE/integrations/hermes/README.md" "$MIRROR/README.md"
          cd "$MIRROR"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date; nothing to push."
            exit 0
          fi
          git commit -m "sync memini Hermes plugin ${TAG}"
          git push origin HEAD:main
  # Publishes the opencode plugin to npm as @eleboucher/opencode-memini so
  # `"plugin": ["@eleboucher/opencode-memini"]` resolves. The version is taken
  # from the release tag, so it always matches regardless of what bump.yml
  # committed. (The curl/local-file install path pulls from `main` and needs no
  # release step.)
  opencode-npm:
    needs: [release]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Install Node.js
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Test and publish opencode plugin to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # This runner resolves `working-directory:` against /tmp; cd instead.
          cd integrations/opencode/plugin
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          node --test
          VERSION="${TAG#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          # Ship the integration README as the npm package page.
          cp ../README.md README.md
          npm publish --access public
  # Publishes the Pi extension to npm as @eleboucher/pi-memini so
  # `"packages": ["npm:@eleboucher/pi-memini"]` resolves. Unlike opencode this
  # plugin is TypeScript: build dist/ (gitignored, referenced by pi.extensions
  # and the package `files`) before publishing. Version comes from the tag.
  pi-npm:
    needs: [release]
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Install Node.js
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install workspace dependencies + build resolver
        run: |
          pnpm install --config.minimumReleaseAge=0
          pnpm --filter @memini/namespace-resolver build

      - name: Test, build and publish Pi extension to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd integrations/pi/plugin
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is empty or missing" >&2
            exit 1
          fi
          pnpm install
          pnpm run build
          npx tsx --test test/helpers.test.ts
      - name: Bump version and publish Pi extension to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd integrations/pi/plugin
          VERSION="${TAG#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          # Ship the integration README as the npm package page.
          cp ../README.md README.md
          npm publish --access public
  container:
    needs: [release]
    runs-on: multiarch
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: "3.0.5"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/docker/setup-buildx-action@v4
      - name: Compute build timestamp
        id: build-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Login to git.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.OWNER_PACKAGE_SECRET }}
      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: https://data.forgejo.org/docker/metadata-action@v6
        with:
          images: |
            git.erwanleboucher.dev/${{ vars.USERNAME }}/memini
            registry.erwanleboucher.dev/${{ vars.USERNAME }}/memini
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Build the binary (with the UI embedded) exactly once. The release
      # archives are extracted from this same build below, not recompiled.
      - name: Build and push
        id: build
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            DATE=${{ steps.build-meta.outputs.created }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/memini-buildcache:release
          cache-to: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/memini-buildcache:release,mode=max,ignore-error=true
      # Reuses the cache above (cache hit, no recompile); copies the bare
      # binaries out of the `artifact` stage to prebuilt/<os>_<arch>/memini.
      - name: Extract release binaries
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: .
          target: artifact
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=prebuilt
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            DATE=${{ steps.build-meta.outputs.created }}
          cache-from: type=registry,ref=registry.erwanleboucher.dev/${{ vars.USERNAME }}/memini-buildcache:release
      - name: Install cosign
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) COSIGN_BIN="cosign-linux-amd64" ;;
            aarch64) COSIGN_BIN="cosign-linux-arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSL -o "${COSIGN_BIN}" "${BASE}/${COSIGN_BIN}"
          curl -fsSL "${BASE}/cosign_checksums.txt" -o checksums.txt
          grep "[[:space:]]${COSIGN_BIN}\$" checksums.txt | sha256sum -c -
          install -m 0755 "${COSIGN_BIN}" /usr/local/bin/cosign
          rm -f "${COSIGN_BIN}" checksums.txt
      - name: Cosign sign image
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
          USERNAME: ${{ vars.USERNAME }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_KEY \
            "git.erwanleboucher.dev/${USERNAME}/memini@${DIGEST}" \
            "registry.erwanleboucher.dev/${USERNAME}/memini@${DIGEST}"
      - name: Stage and archive
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for ARCH in amd64 arm64; do
            STAGE="memini_${VERSION}_linux_${ARCH}"
            mkdir -p "$STAGE"
            install -m 0755 "prebuilt/linux_${ARCH}/memini" "$STAGE/memini"
            cp LICENSE README.md "$STAGE/"
            tar -czf "${STAGE}.tar.gz" "$STAGE"
          done
          sha256sum memini_*.tar.gz > "memini_${VERSION}_checksums.txt"
      - name: Cosign sign-blob checksums
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHECKSUMS="memini_${VERSION}_checksums.txt"
          cosign sign-blob --yes \
            --key env://COSIGN_KEY \
            --bundle "${CHECKSUMS}.cosign.bundle" \
            "${CHECKSUMS}"
      - name: Upload assets to release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          upload() {
            local file="$1"
            local response http_code body
            response="$(curl -sS -X POST \
              -w '\n%{http_code}' \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://git.erwanleboucher.dev/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=$(basename "${file}")")"
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$http_code" != "201" ]; then
              echo "asset upload failed for ${file}: HTTP $http_code" >&2
              echo "$body" >&2
              return 1
            fi
          }
          VERSION="${TAG#v}"
          CHECKSUMS="memini_${VERSION}_checksums.txt"
          for ARCH in amd64 arm64; do
            upload "memini_${VERSION}_linux_${ARCH}.tar.gz"
          done
          upload "${CHECKSUMS}"
          upload "${CHECKSUMS}.cosign.bundle"
  helm:
    needs: [container]
    runs-on: multiarch
    env:
      VERSION: ${{ github.ref_name }}
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: "4.2.0"
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: "3.0.5"
      # renovate: datasource=github-releases depName=google/go-containerregistry
      CRANE_VERSION: "0.21.6"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Install helm
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) HELM_ARCH="amd64" ;;
            aarch64) HELM_ARCH="arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          TARBALL="helm-v${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
          BASE="https://get.helm.sh"
          curl -fsSL -o "${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL "${BASE}/${TARBALL}.sha256sum" | sha256sum -c -
          tar -xzf "${TARBALL}" "linux-${HELM_ARCH}/helm"
          install -m 0755 "linux-${HELM_ARCH}/helm" /usr/local/bin/helm
          rm -rf "${TARBALL}" "linux-${HELM_ARCH}"
      - name: Install crane
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) CRANE_ARCH="x86_64" ;;
            aarch64) CRANE_ARCH="arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}"
          TARBALL="go-containerregistry_Linux_${CRANE_ARCH}.tar.gz"
          curl -fsSL -o "${TARBALL}" "${BASE}/${TARBALL}"
          tar -xzf "${TARBALL}" -C /tmp crane
          install -m 0755 /tmp/crane /usr/local/bin/crane
          rm -f "${TARBALL}" /tmp/crane
      # Released charts reference immutable images; fail closed rather than
      # fall back to a floating tag.
      - name: Pin the released image digest into the chart
        env:
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "container build produced no digest" >&2; exit 1; }
          # digest lives under controllers.main.containers.main.image (indented);
          # match any leading whitespace and preserve it.
          sed -i 's|^\( *\)digest: ""$|\1digest: "'"${DIGEST}"'"|' charts/memini/values.yaml
          grep -q 'digest: "'"${DIGEST}"'"$' charts/memini/values.yaml
      - name: Login to git.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: git.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.OWNER_PACKAGE_SECRET }}
      - name: Login to registry.erwanleboucher.dev
        uses: https://data.forgejo.org/docker/login-action@v4
        with:
          registry: registry.erwanleboucher.dev
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APOCI_REGISTRY_TOKEN }}
      - name: Build chart dependencies
        run: |
          set -euo pipefail
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          helm dependency build charts/memini
      - name: Package and push chart to git.erwanleboucher.dev
        id: push-git
        run: |
          set -euo pipefail
          helm package charts/memini \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm push "memini-${VERSION}.tgz" "oci://git.erwanleboucher.dev/${{ vars.USERNAME }}/charts"
          DIGEST="$(crane digest "git.erwanleboucher.dev/${{ vars.USERNAME }}/charts/memini:${VERSION}")"
          [ -n "${DIGEST}" ] || { echo "crane digest returned empty" >&2; exit 1; }
          echo "git-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Package and push chart to registry.erwanleboucher.dev
        id: push-registry
        run: |
          set -euo pipefail
          helm package charts/memini \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm push "memini-${VERSION}.tgz" "oci://registry.erwanleboucher.dev/${{ vars.USERNAME }}/charts"
          DIGEST="$(crane digest "registry.erwanleboucher.dev/${{ vars.USERNAME }}/charts/memini:${VERSION}")"
          [ -n "${DIGEST}" ] || { echo "crane digest returned empty" >&2; exit 1; }
          echo "registry-digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64) COSIGN_BIN="cosign-linux-amd64" ;;
            aarch64) COSIGN_BIN="cosign-linux-arm64" ;;
            *) echo "unsupported host arch: $HOST_ARCH" >&2; exit 1 ;;
          esac
          BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl -fsSL -o "${COSIGN_BIN}" "${BASE}/${COSIGN_BIN}"
          curl -fsSL "${BASE}/cosign_checksums.txt" -o checksums.txt
          grep "[[:space:]]${COSIGN_BIN}\$" checksums.txt | sha256sum -c -
          install -m 0755 "${COSIGN_BIN}" /usr/local/bin/cosign
          rm -f "${COSIGN_BIN}" checksums.txt
      - name: Cosign sign charts
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          OWNER_PACKAGE_SECRET: ${{ secrets.OWNER_PACKAGE_SECRET }}
          APOCI_REGISTRY_TOKEN: ${{ secrets.APOCI_REGISTRY_TOKEN }}
          USERNAME: ${{ vars.USERNAME }}
          GIT_DIGEST: ${{ steps.push-git.outputs.git-digest }}
          REGISTRY_DIGEST: ${{ steps.push-registry.outputs.registry-digest }}
        run: |
          set -euo pipefail
          # helm registry login only fills helm's config; cosign reads the
          # docker config, so it needs its own login per registry.
          echo "${OWNER_PACKAGE_SECRET}" | cosign login git.erwanleboucher.dev --username "${USERNAME}" --password-stdin
          echo "${APOCI_REGISTRY_TOKEN}" | cosign login registry.erwanleboucher.dev --username "${USERNAME}" --password-stdin
          cosign sign --yes --key env://COSIGN_KEY \
            "git.erwanleboucher.dev/${USERNAME}/charts/memini@${GIT_DIGEST}" \
            "registry.erwanleboucher.dev/${USERNAME}/charts/memini@${REGISTRY_DIGEST}"
