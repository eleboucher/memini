---
name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto (infer from commits), patch, minor, major, or explicit X.Y.Z"
        required: true
        default: "auto"
        type: string

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    permissions:
      contents: write
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          # Authenticate (and persist) with a PAT so the tag push below is
          # authored by that user. The automatic Actions token can write but
          # its pushes never trigger another workflow (recursion guard), so
          # release.yml would not start. Must be a user PAT with content:write.
          token: ${{ secrets.OWNER_PACKAGE_SECRET }}
      - name: Install git-cliff
        env:
          # renovate: datasource=github-releases depName=orhun/git-cliff
          GIT_CLIFF_VERSION: "2.12.0"
        run: |
          set -euo pipefail
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          curl -fsSL -O "${BASE}/${ASSET}"
          curl -fsSL -O "${BASE}/${ASSET}.sha512"
          sha512sum -c "${ASSET}.sha512"
          tar -xzf "${ASSET}" -C /tmp
          install -m 0755 "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Compute next version
        id: version
        env:
          INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "$INPUT" in
            auto)
              NEXT="$(git-cliff --config cliff.toml --bumped-version)"
              ;;
            major|minor|patch)
              NEXT="$(git-cliff --config cliff.toml --bump "$INPUT" --bumped-version)"
              ;;
            [0-9]*.[0-9]*.[0-9]*) NEXT="v$INPUT" ;;
            v[0-9]*) NEXT="$INPUT" ;;
            *) echo "Unknown bump input: $INPUT" >&2; exit 1 ;;
          esac
          NEXT="${NEXT#v}"
          if [ -z "$NEXT" ]; then
            echo "git-cliff returned empty version" >&2; exit 1
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEXT"
      - name: Sync plugin manifest versions
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          for f in plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json \
                   integrations/openclaw/plugin/package.json \
                   integrations/openclaw/plugin/openclaw.plugin.json \
                   integrations/opencode/plugin/package.json \
                   integrations/pi/plugin/package.json; do
            sed -i -E 's/("version"[[:space:]]*:[[:space:]]*")[^"]*(")/\1'"${NEXT}"'\2/' "$f"
            grep -q "\"version\": \"${NEXT}\"" "$f" || { echo "failed to set version in $f" >&2; exit 1; }
            # Keep the commit honest: the file must still be valid JSON.
            jq -e . "$f" >/dev/null
          done
          # The OpenClaw and Hermes plugin manifests are YAML, so sync those separately.
          for y in integrations/openclaw/plugin/plugin.yaml \
                   integrations/hermes/plugin/memini/plugin.yaml; do
            sed -i -E 's/^(version:[[:space:]]*).*/\1'"${NEXT}"'/' "$y"
            grep -q "^version: ${NEXT}\$" "$y" || { echo "failed to set version in $y" >&2; exit 1; }
          done
          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"${NEXT}"'\2/' Cargo.toml
          grep -q "^version = \"${NEXT}\"$" Cargo.toml || { echo "failed to set version in Cargo.toml" >&2; exit 1; }
          cargo update --workspace
      - name: Commit and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "actions@git.erwanleboucher.dev"
          git add Cargo.toml Cargo.lock plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json \
            integrations/openclaw/plugin/package.json \
            integrations/openclaw/plugin/openclaw.plugin.json \
            integrations/openclaw/plugin/plugin.yaml \
            integrations/opencode/plugin/package.json \
            integrations/pi/plugin/package.json \
            integrations/hermes/plugin/memini/plugin.yaml
          # A no-op bump (auto found no conventional commits since the last
          # tag, or an explicit version equal to the current one) stages
          # nothing; git commit would die with a cryptic "nothing to commit".
          # Fail with an actionable message instead.
          if git diff --cached --quiet; then
            echo "No manifest changes: version is already ${TAG#v}." >&2
            echo "Auto-bump found no conventional commits since the last tag (or you targeted the current version). Re-run with an explicit patch/minor/major, or use conventional-commit messages so a new version is computed." >&2
            exit 1
          fi
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "${TAG}"
