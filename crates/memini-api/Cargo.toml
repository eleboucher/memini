[package]
name="memini-api"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true

[dependencies]
futures-util="0.3"
axum={version="0.8",features=["json","query","tokio"]}
axum-extra={version="0.10",features=["query"]}
chrono.workspace=true
memini-auth={path="../memini-auth"}
memini-core={path="../memini-core"}
memini-maintenance={path="../memini-maintenance"}
memini-observability={path="../memini-observability"}
memini-service={path="../memini-service"}
memini-store={path="../memini-store"}
serde.workspace=true
serde_json.workspace=true
tokio.workspace=true
tower-http={version="0.6",features=["timeout","trace","cors"]}

[dev-dependencies]
async-trait.workspace=true
http-body-util="0.1"
memini-embed={path="../memini-embed"}
memini-sqlite={path="../memini-sqlite"}
tempfile="3"
tower={version="0.5",features=["util"]}
