[package]
name="memini-cli"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true

[[bin]]
name="memini"
path="src/main.rs"

[features]
gendocs=["dep:serde_yaml"]

[dependencies]
anyhow="1"
axum="0.8"
http-body-util="0.1"
chrono.workspace=true
clap={version="4",features=["derive"]}
memini-api={path="../memini-api"}
memini-auth={path="../memini-auth"}
memini-config={path="../memini-config"}
memini-core={path="../memini-core"}
memini-embed={path="../memini-embed"}
memini-import={path="../memini-import"}
memini-intelligence={path="../memini-intelligence"}
memini-llm={path="../memini-llm"}
memini-maintenance={path="../memini-maintenance"}
memini-observability={path="../memini-observability"}
memini-postgres={path="../memini-postgres"}
memini-rerank={path="../memini-rerank"}
memini-service={path="../memini-service"}
memini-sqlite={path="../memini-sqlite"}
memini-store={path="../memini-store"}
serde_json.workspace=true
serde.workspace=true
serde_yaml={version="0.9",optional=true}
reqwest.workspace=true
tokio={workspace=true,features=["signal","io-std","io-util"]}
tower={version="0.5",features=["util"]}
tracing-subscriber={version="0.3",features=["env-filter","json"]}

[dev-dependencies]
tempfile="3"
