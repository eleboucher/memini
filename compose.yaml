name: memini

services:
  db:
    image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1
    environment:
      POSTGRES_PASSWORD: memini
      POSTGRES_DB: memini
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "8081:80"

  memini:
    build: .
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
    environment:
      MEMINI_BACKEND: postgres
      MEMINI_POSTGRES_DSN: postgres://postgres:memini@db:5432/memini?sslmode=disable
      MEMINI_EMBED_BASE_URL: http://embeddings:80/v1
      MEMINI_EMBED_MODEL: BAAI/bge-small-en-v1.5
      MEMINI_EMBED_DIMS: "384"
      MEMINI_LOG_FORMAT: text
      # Opt-in consolidation: point at any OpenAI-compatible chat endpoint.
      # MEMINI_LLM_BASE_URL: http://your-llm/v1
      # MEMINI_LLM_MODEL: gpt-4o-mini
      # Break-glass admin/bootstrap credential. Turns auth on for /v1 and /mcp.
      # No longer the only admin: named/file keys can carry admin: true, so keep
      # this as recovery and issue per-person keys below. See docs/api-keys.md.
      # MEMINI_API_KEY: change-me
      # Declarative named keys (one admin key per human, non-admin per agent/CI).
      # Mount the file read-only and point the server at it; see the `volumes`
      # block below and docs/guides/access-control.md for the file's contents.
      # MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
    ports:
      - "8080:8080"
    # volumes:
    #   # SOPS-decrypt api-keys.yaml before it reaches here in a real deploy.
    #   - ./api-keys.yaml:/etc/memini/api-keys.yaml:ro
