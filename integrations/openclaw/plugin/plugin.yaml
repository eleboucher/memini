name: memini
version: 0.5.3
description: "Persistent cross-session memory for OpenClaw via memini. Claims the plugins.slots.memory slot."
homepage: "https://github.com/eleboucher/memini"
license: AGPL-3.0

category: memory
tags:
  - memory
  - persistence
  - context

hooks:
  - before_prompt_build
  - agent_end

config:
  enabled: true
  base_url: http://localhost:8080
  namespace: openclaw
  namespace_per_agent: true
  namespace_template: "{namespace}-{agent}"
  fallback_on_error: true
  timeout_ms: 5000
  expose_tools: false
