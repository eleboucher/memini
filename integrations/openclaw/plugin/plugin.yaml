name: memini
version: 0.1.0
description: "Persistent cross-session memory for OpenClaw via memini. Claims the plugins.slots.memory slot."
homepage: "https://github.com/eleboucher/memini"
license: AGPL-3.0

category: memory
tags:
  - memory
  - persistence
  - context

hooks:
  - before_agent_start
  - agent_end

config:
  enabled: true
  base_url: http://localhost:8080
  namespace: openclaw
  namespace_per_agent: false
  namespace_template: "{agent}"
  fallback_on_error: true
  timeout_ms: 5000
