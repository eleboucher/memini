# This chart is powered by the bjw-s common library (v5.0.1) and uses its
# native values API. See https://bjw-s-labs.github.io/helm-charts/docs/common-library/
#
# Default backend is sqlite: a single-replica StatefulSet with a PVC at /data.
# To run the scale-out postgres backend instead, see the commented "postgres
# backend" notes against controllers.main below and on the MEMINI_* env keys.
controllers:
  main:
    # -- Controller type. `statefulset` for the default sqlite backend (PVC at
    # /data, single replica). For the postgres backend switch this to
    # `deployment` (no PVC, scale-out) — see env MEMINI_BACKEND below.
    type: statefulset
    # -- Replica count. sqlite is single-writer so keep at 1. With postgres
    # (type: deployment) you can scale out, or drive it via horizontalPodAutoscaler.
    replicas: 1
    pod:
      # -- Pod-level security context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
    # -- HorizontalPodAutoscaler (postgres / deployment backend only — sqlite is
    # single-writer). Uncomment after switching type to `deployment`:
    # horizontalPodAutoscaler:
    #   minReplicas: 2
    #   maxReplicas: 10
    #   metrics:
    #     - type: Resource
    #       resource:
    #         name: cpu
    #         target:
    #           type: Utilization
    #           averageUtilization: 80
    containers:
      main:
        image:
          # -- Container image repository.
          repository: registry.erwanleboucher.dev/eleboucher/memini
          # -- Image tag. Empty falls back to the chart appVersion.
          tag: ""
          # -- Image digest (sha256:...); takes precedence over tag when set.
          # The release pipeline rewrites this line.
          digest: ""
          # -- Image pull policy.
          pullPolicy: IfNotPresent
        # -- Container probes. Liveness hits /healthz, readiness hits /readyz.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 15
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 3
              periodSeconds: 10
        # -- Container security context.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # -- Environment variables (MEMINI_*). Dictionary style. The always-on
        # defaults below configure the sqlite backend; commented entries are
        # optional knobs operators can uncomment.
        env:
          # -- HTTP listen address.
          MEMINI_HTTP_ADDR: ":8080"
          # -- Dedicated metrics listener; keeps /metrics off the main port and
          # every route, so it needs no bearer token. "" serves it on the main port.
          MEMINI_METRICS_ADDR: ":9090"
          # -- Dedicated admin-UI listener. The UI shell embeds MEMINI_API_KEY so
          # the browser can call /v1; serving it on its own port keeps that key off
          # the main port (which then carries only the token-free API). Expose this
          # port only on a trusted (LAN) gateway — see route.ui. "" serves the UI
          # on the main port instead (the key then rides / on the main port).
          MEMINI_UI_ADDR: ":8081"
          # -- Storage backend: "sqlite" (default) or "postgres". For postgres,
          # set this to "postgres", switch controllers.main.type to deployment,
          # disable persistence.data, and wire MEMINI_POSTGRES_DSN below.
          MEMINI_BACKEND: "sqlite"
          # -- Log level.
          MEMINI_LOG_LEVEL: "info"
          # -- Log format (json|text).
          MEMINI_LOG_FORMAT: "json"
          # -- Default namespace for memories.
          MEMINI_DEFAULT_NAMESPACE: "default"
          # -- Decay sweeper interval (Go duration).
          MEMINI_SWEEP_INTERVAL: "1h"
          # -- OpenAI-compatible embeddings endpoint (required for vector search).
          MEMINI_EMBED_BASE_URL: ""
          # -- Embedding model name.
          MEMINI_EMBED_MODEL: "text-embedding-3-small"
          # -- Embedding dimensionality; MUST match the deployed model.
          MEMINI_EMBED_DIMS: "1536"
          # -- sqlite database path (kept on the PVC mounted at /data).
          MEMINI_SQLITE_PATH: "/data/memini.db"
          # -- Serve the embedded admin SPA at /. Set "false" for headless API/MCP.
          MEMINI_UI_ENABLED: "true"
          # --- Decay / hygiene knobs ---
          # Demotion is ON by default (168h), not opt-in: a durable memory that
          # was never recalled, is unimportant and is uncorroborated drops back
          # to episodic after a week. Uncomment to lengthen it, or set "0" to
          # turn it off. See docs/reference/configuration.md#memini_demote_after.
          # MEMINI_DEMOTE_AFTER: "1440h"
          # The rest are off unless you uncomment them.
          # MEMINI_TOMBSTONE_TTL: "720h"          # hard-delete superseded memories after TTL
          # MEMINI_WRITE_DEDUP_SCORE: "0.625"     # similarity to treat a write as a near-dup ("0" disables)
          # MEMINI_WRITE_DEDUP_ACTION: "hint"     # hint (default) | coalesce | supersede | off
          # GitOps-managed global client behavior defaults (config-handshake redesign):
          # a JSON-encoded ClientSettings object that becomes every key's default
          # settings layer and locks it read-only (PUT /v1/settings/defaults 409s
          # while this is set). See docs/reference/configuration.md#memini_client_defaults.
          # MEMINI_CLIENT_DEFAULTS: '{"capture_turns":false,"recall_limit":5}'
  # --- Optional embeddings tuning ---
  # MEMINI_EMBED_MAX_BATCH: "20"          # max items per /embeddings request
  # MEMINI_EMBED_MAX_BATCH_CHARS: "24000" # max total chars per request (0 disables)

  # --- Optional LLM consolidation (leave base URL empty to run headless) ---
  # MEMINI_LLM_BASE_URL: "http://llm:8080/v1"
  # MEMINI_LLM_MODEL: "gpt-4o-mini"

  # --- Optional recall reranking ---
  # MEMINI_RERANK: "http://reranker:8080/v1" # "" / "off" / "llm" / cross-encoder URL
  # MEMINI_RERANK_MODEL: "bge-reranker-v2-m3"
  # How many candidates reach the reranker before truncating to the recall limit.
  # 0 reranks only the limit, so the reranker reorders the results but can never
  # surface a memory that ranked below them. Set it to let the cross-encoder
  # rescue those; ~50 (the retrieval pool size) is the ceiling. Cost is linear.
  # MEMINI_RERANK_POOL: "50"
  # HTTP payload guard, not a context-window guard: a /rerank server scores each
  # (query, document) pair separately. Too low and a deep RERANK_POOL shards into
  # many *serial* requests and blows MEMINI_RERANK_TIMEOUT. Per-doc cap is 2048.
  # MEMINI_RERANK_MAX_BATCH_CHARS: "120000"

  # --- postgres backend connection (required when MEMINI_BACKEND=postgres) ---
  # MEMINI_POSTGRES_DSN:
  #   valueFrom:
  #     secretKeyRef:
  #       name: memini-pg
  #       key: dsn

  # --- API keys for external providers (valueFrom secretKeyRef) ---
  # MEMINI_EMBED_API_KEY:
  #   valueFrom:
  #     secretKeyRef:
  #       name: memini-embed
  #       key: api-key
  # MEMINI_LLM_API_KEY:
  #   valueFrom:
  #     secretKeyRef:
  #       name: memini-llm
  #       key: api-key
  # MEMINI_RERANK_API_KEY:
  #   valueFrom:
  #     secretKeyRef:
  #       name: memini-rerank
  #       key: api-key

  # --- Bearer-token auth (protects both /v1 and /mcp) ---
  # REQUIRED before exposing memini off-cluster via a route. There is no
  # chart-created secret: reference your own Secret here.
  # MEMINI_API_KEY:
  #   valueFrom:
  #     secretKeyRef:
  #       name: memini-auth
  #       key: api-key

  # -- Periodic fsck CronJob. Disabled by default — the in-process sweeper
  # already handles decay. If enabled, the container needs MEMINI_API_KEY in env
  # and uses curl's --variable/--expand-header so the token never lands in argv.
  fsck:
    enabled: false
    type: cronjob
    cronjob:
      schedule: "0 * * * *"
      concurrencyPolicy: Forbid
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      # -- Pin the fsck pod to a node that already runs the main StatefulSet
      # pod. Useful when fsck is extended to touch the RWO PVC directly. Label-
      # based, so it follows the StatefulSet if it ever moves. Drop this block
      # (or set to `{}`) to let the scheduler pick any node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/controller
                    operator: In
                    values:
                      - main
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - "{{ .Release.Name }}"
              topologyKey: kubernetes.io/hostname
    containers:
      fsck:
        image:
          repository: curlimages/curl
          tag: "8.21.0"
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - >-
            curl -sf -X POST --variable "MEMINI_API_KEY=$MEMINI_API_KEY" --expand-header "Authorization: Bearer {{MEMINI_API_KEY}}" http://memini:8080/v1/fsck
        # -- Provide the bearer token to the curl --variable above. Point at the
        # same Secret as the main container's MEMINI_API_KEY.
        # env:
        #   MEMINI_API_KEY:
        #     valueFrom:
        #       secretKeyRef:
        #         name: memini-auth
        #         key: api-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
# -- ServiceAccount created for the workload.
serviceAccount:
  main: {}
service:
  main:
    # -- Primary Service. Targets the main controller. Common derives the
    # container ports from these ports.
    controller: main
    ports:
      http:
        port: 8080
        primary: true
      # -- Dedicated admin-UI port (MEMINI_UI_ADDR). Carries the token-embedding
      # shell; wire route.ui to it and keep that route on an internal gateway.
      ui:
        port: 8081
      # -- Dedicated metrics port (MEMINI_METRICS_ADDR). Not referenced by any
      # route, so /metrics stays in-cluster.
      metrics:
        port: 9090
# -- Persistent storage for the sqlite backend, mounted at /data. A standalone
# PVC (single-replica memini sqlite is single-writer). For the postgres backend
# set `persistence.data.enabled: false`.
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    # -- Attach a pre-created PVC instead (e.g. restored by VolSync). When set,
    # size/accessMode are ignored.
    # existingClaim: memini-data
    # -- Storage class; null uses the cluster default.
    # storageClass: ""
    globalMounts:
      - path: /data
# -- Prometheus Operator ServiceMonitor. Disabled by default; flip `enabled` to
# scrape /metrics from the dedicated `metrics` port (MEMINI_METRICS_ADDR / the
# service port below). That port is unauthenticated and kept off every route, so
# the scrape needs no bearer token. If you instead serve /metrics on the main
# port (MEMINI_METRICS_ADDR: ""), point the endpoint at `port: http` and, when
# MEMINI_API_KEY is set, add an `authorization.credentials` secret reference.
serviceMonitor:
  main:
    enabled: false
    service:
      identifier: main
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
# -- Gateway API HTTPRoutes (the modern replacement for Ingress). BOTH disabled
# by default — the operator enables and attaches them to an existing Gateway.
# Exposing /v1 or /mcp REQUIRES bearer auth: set MEMINI_API_KEY (see env above).
route:
  # -- Public API + MCP surface, on the token-free `http` port. Enable, set the
  # gateway in parentRefs and the hostname. Because MEMINI_UI_ADDR moves the
  # token-embedding shell to its own port, this route can safely forward all of
  # `http` (only /v1, /mcp, /healthz, /readyz live there — no API key). Add
  # rules[].matches to scope it further if you want to keep the probes private.
  main:
    enabled: false
    kind: HTTPRoute
    parentRefs: []
    hostnames: []
    rules:
      - backendRefs:
          - identifier: main
            port: http
  # -- Admin UI, on the `ui` port (MEMINI_UI_ADDR) whose shell embeds the API
  # key. Disabled by default; enable on installs that want the SPA through a
  # Gateway, and wire it to an INTERNAL gateway so the key never leaves the LAN.
  # If MEMINI_UI_ADDR is "" the UI rides the main port instead — then point this
  # at `port: http` and treat that whole route as trusted.
  ui:
    enabled: false
    kind: HTTPRoute
    parentRefs: []
    hostnames: []
    rules:
      - backendRefs:
          - identifier: main
            port: ui
# -- Bundled Grafana dashboards, rendered as ConfigMaps for the grafana-operator
# (a custom chart key, not part of the common library). Point your Grafana CR's
# `dashboardsConfigMaps` selector at this release's namespace; the operator picks
# up any ConfigMap labelled `grafana_dashboard: "1"`.
grafanaDashboards:
  # -- Render the bundled dashboard as a ConfigMap.
  enabled: false
  # -- grafana_dashboard_folder annotation; controls where it lands in Grafana.
  folder: memini
